# Stack pentru Coolify: două servicii, aceeași imagine, același volum.
#
# În Coolify: „New Resource” -> „Public Repository”, iar la **Build Pack** alege
# **Docker Compose**, nu Nixpacks. Nixpacks ar ghici o singură aplicație Python
# și ar porni-o pe ea; aici sunt două servicii care împart un volum.
#
# Domeniul se pune pe serviciul `dashboard`. Nu trebuie ales portul din
# interfață: îl declară `SERVICE_FQDN_DASHBOARD_3000` mai jos.

services:
  # Ține registrul la zi în volum. Implicit aduce fișierele gata construite
  # din depozit, fiindcă sursele resping adresele de centru de date; colectarea
  # propriu-zisă rulează pe o mașină de pe care ele răspund.
  # Nu are domeniu: nu ascultă pe niciun port, doar scrie în volum.
  scheduler:
    build:
      context: .
      target: scheduler
    restart: unless-stopped
    environment:
      # Ziua 1 a lunii, 03:00 UTC. Sursele naționale publică trimestrial,
      # deci mai des nu are ce să aducă.
      - REGISTRU_CRON=${REGISTRU_CRON:-0 3 1 * *}
      - REGISTRU_DATA_DIR=/data
      # „colectare” aduce datele de la surse; „sync” le ia gata construite din
      # depozit. A doua e pentru mașinile pe care sursele le resping — iar
      # serverele de centru de date sunt respinse, verificat.
      - REGISTRU_MOD=${REGISTRU_MOD:-sync}
      - REGISTRU_SURSA=${REGISTRU_SURSA:-}
    volumes:
      - registru-data:/data

  # Servește interfața. Nu scrie nimic în registru, doar citește.
  dashboard:
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    environment:
      # Variabilă „magică” a Coolify: numele se formează din numele serviciului
      # și portul din container.
      # https://coolify.io/docs/knowledge-base/docker/compose
      #
      # Declarată fără valoare, dinadins. Un FQDN fixat aici nu este acceptat:
      # Coolify reconciliază domeniul spre gol la următoarea desfășurare, adică
      # ar șterge exact domeniul pe care voiam să-l fixăm. Declarația goală îi
      # spune doar ce port să lege, iar domeniul rămâne al lui — este singurul
      # lucru pe care interfața insistă să-l dețină.
      #
      # Prima instalare primește un domeniu generat; cel dorit se pune o dată,
      # din interfață, și de atunci se păstrează.
      - SERVICE_FQDN_DASHBOARD_3000
      - REGISTRU_DATA_DIR=/data
      # Reflex are nevoie de adresa completă, cu schemă, ca interfața din
      # browser să știe unde e partea de server. Se pune direct, fiindcă acum
      # domeniul îl stabilește interfața: `REGISTRU_API_URL` se completează
      # acolo, la variabile de mediu, cu adresa publică.
      - API_URL=${REGISTRU_API_URL:-http://localhost:3000}
    # `expose`, nu `ports`: portul nu se publică pe gazdă, doar îl vede
    # proxy-ul Coolify. Pe gazdă ar ocupa un port la întâmplare, degeaba.
    expose:
      - "3000"
    volumes:
      - registru-data:/data
    depends_on:
      - scheduler

volumes:
  # Aici stau fișierele descărcate, registrele și jurnalul rulărilor. Fără
  # volum, fiecare redesfășurare ar reporni colectarea de la zero: 5.233 de
  # fișe de apel, arhiva și parsarea PDF-urilor, adică aproape o oră.
  registru-data:
