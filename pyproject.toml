[project]
name = "registru-fonduri-ue"
version = "0.1.0"
description = "Registru deschis al proiectelor cu finanțare europeană în România, cu accent pe software"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [{ name = "Tudor Andrei Dumitrașcu" }]
keywords = ["fonduri-europene", "open-data", "romania", "esif", "cohesion-policy"]

dependencies = [
    "croniter>=3.0",
    "duckdb>=1.1",
    "fastexcel>=0.12",
    "httpx>=0.27",
    "pdfplumber>=0.11.10",
    "polars>=1.9",
    "pyarrow>=17",
    "rich>=13.7",
    "typer>=0.12",
    "wayback>=0.5.1",
]

[project.optional-dependencies]
dashboard = ["reflex>=0.9.8"]

[project.scripts]
registru = "registru.cli:app"

[project.urls]
Homepage = "https://github.com/TudorAndrei/registru-fonduri-ue"
Issues = "https://github.com/TudorAndrei/registru-fonduri-ue/issues"

[dependency-groups]
dev = ["ruff>=0.16", "ty>=0.0.69"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registru", "dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "A", "C4", "RET", "S"]
[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["registru", "dashboard"]

[tool.ty.rules]
# Reflex construiește atributele de stare dinamic; `ty` nu le poate urmări.
unresolved-attribute = "warn"
possibly-missing-attribute = "warn"

